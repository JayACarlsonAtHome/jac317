# TreeSync requirements: what bootstrap.sh checks and, when missing, how it installs
# them, per Linux family (data, like jac313's Setup/recipes.conf).
#
#   <name>.desc      what it is, shown in the plan
#   <name>.check     shell test: true when it is already there (tools.sh is loaded)
#   <name>.required  true: no build without it (else optional: tests, compare)
#   <name>.<family>  the install command (rhel | fedora | linuxmint); sudo where needed
#
# Families: rhel (RHEL, Rocky, Alma, CentOS), fedora, linuxmint (Mint, Ubuntu, Debian).

gcc.desc      = GCC 15 or newer (C++26)
gcc.required  = true
gcc.check     = [ -n "$(find_gcc)" ]
gcc.rhel      = sudo dnf install -y gcc-toolset-15
gcc.fedora    = sudo dnf install -y gcc gcc-c++
gcc.linuxmint = sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y g++-15

clang.desc      = Clang 21 or newer (C++26)
clang.required  = true
clang.check     = [ -n "$(find_clang)" ]
clang.rhel      = sudo dnf install -y clang
clang.fedora    = sudo dnf install -y clang
clang.linuxmint = wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh 21

gui.desc      = GTK 3 and the libraries U++ GUIs build with (gtk3, libnotify, freetype, fontconfig, X11, bzip2, OpenSSL for SSH)
gui.required  = true
gui.check     = pkg-config --exists gtk+-3.0 libnotify freetype2 fontconfig x11 openssl && [ -e /usr/include/bzlib.h ]
gui.rhel      = sudo dnf install -y gtk3-devel libnotify-devel freetype-devel fontconfig-devel libX11-devel bzip2-devel openssl-devel pkgconf-pkg-config
gui.fedora    = sudo dnf install -y gtk3-devel libnotify-devel freetype-devel fontconfig-devel libX11-devel bzip2-devel openssl-devel pkgconf-pkg-config
gui.linuxmint = sudo apt-get install -y libgtk-3-dev libnotify-dev libfreetype-dev libfontconfig1-dev libx11-dev libbz2-dev libssl-dev pkg-config

tools.desc      = make, git, curl, tar, xz (to fetch and build U++)
tools.required  = true
tools.check     = command -v make && command -v git && command -v curl && command -v tar && command -v xz
tools.rhel      = sudo dnf install -y make git curl tar xz
tools.fedora    = sudo dnf install -y make git curl tar xz
tools.linuxmint = sudo apt-get install -y make git curl tar xz-utils

testing.desc      = bc and OpenSSH (client + server) for the compare step and the SFTP tests
testing.check     = command -v bc && command -v ssh && [ -x /usr/sbin/sshd ]
testing.rhel      = sudo dnf install -y bc openssh-clients openssh-server
testing.fedora    = sudo dnf install -y bc openssh-clients openssh-server
testing.linuxmint = sudo apt-get install -y bc openssh-client openssh-server

checks.desc      = AddressSanitizer + UBSan runtimes (gcc and clang) and valgrind, for the checked test runs
checks.check     = checks_present
checks.rhel      = sudo dnf install -y gcc-toolset-15-libasan-devel gcc-toolset-15-libubsan-devel compiler-rt valgrind
checks.fedora    = sudo dnf install -y libasan libubsan compiler-rt valgrind
checks.linuxmint = sudo apt-get install -y libclang-rt-21-dev valgrind

uppfix.desc      = U++ heap alignment fix (one line; gcc release builds crash without it: docs/findings/upp_heap_tls_misaligned.md)
uppfix.required  = true
uppfix.check     = upp_heap_fixed
uppfix.rhel      = upp_fix_heap
uppfix.fedora    = upp_fix_heap
uppfix.linuxmint = upp_fix_heap
